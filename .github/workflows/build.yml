name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test app/src/test-js/*.test.mjs
      - name: Download MediaPipe assets
        run: |
          W=app/src/main/assets/web
          mkdir -p $W/lib/mediapipe/wasm $W/models
          curl -fsSL -o $W/models/pose_landmarker_lite.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          V=https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14
          curl -fsSL -o $W/lib/mediapipe/vision_bundle.mjs $V/vision_bundle.mjs
          curl -fsSL -o $W/lib/mediapipe/wasm/vision_wasm_internal.js $V/wasm/vision_wasm_internal.js
          curl -fsSL -o $W/lib/mediapipe/wasm/vision_wasm_internal.wasm $V/wasm/vision_wasm_internal.wasm
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Poseme3D-debug-apk, path: app/build/outputs/apk/debug/*.apk }
